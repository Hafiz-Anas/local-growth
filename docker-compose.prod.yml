# The production image with everything it talks to, on one machine — to try the Kubernetes setup without
# DigitalOcean. MinIO stands in for Spaces (same S3 API), Valkey for the managed Redis/Valkey.
# NOT for production; test-only values below. The plain `docker-compose.yml` (Postgres only) is unchanged.
#
#   docker compose -f docker-compose.prod.yml up --build -d
#   docker compose -f docker-compose.prod.yml --profile seed run --rm seed     # optional demo data
#   open http://localhost:3000   ·   health: http://localhost:3000/api/health?ready=1
#   docker compose -f docker-compose.prod.yml down -v

x-app-env: &app-env
  DATABASE_URL: postgresql://lge:lge@postgres:5432/lge
  AUTH_SECRET: local-compose-only-not-a-secret-0000000000
  AUTH_URL: http://localhost:3000
  # 32 zero bytes, base64 — local only.
  ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  CRON_SECRET: local-compose-cron
  EMAIL_PROVIDER: console
  EMAIL_FROM: "AI Growth Engine <noreply@example.com>"
  INSTAGRAM_PROVIDER: mock
  AI_PROVIDER: mock
  IMAGE_PROVIDER: mock
  DEMO_ACCOUNTS_ENABLED: "true"
  STORAGE_PROVIDER: spaces
  SPACES_ENDPOINT: http://minio:9000
  SPACES_PUBLIC_ENDPOINT: http://localhost:9000
  SPACES_FORCE_PATH_STYLE: "true"
  SPACES_REGION: us-east-1
  SPACES_BUCKET: lge-local
  SPACES_KEY: lge-local
  SPACES_SECRET: lge-local-secret
  RATE_LIMIT_STORE: redis
  REDIS_URL: redis://valkey:6379

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lge
      POSTGRES_PASSWORD: lge
      POSTGRES_DB: lge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lge -d lge"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: lge-local
      MINIO_ROOT_PASSWORD: lge-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"

  # The bucket, private. (MinIO accepts browser uploads from any origin by default; on Spaces DevOps
  # applies the CORS rule in DEPLOY-DIGITALOCEAN.md.)
  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 lge-local lge-local-secret; do sleep 1; done;
      mc mb --ignore-existing local/lge-local;
      mc anonymous set none local/lge-local;
      echo done"

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://lge:lge@postgres:5432/lge
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., target: runner }
    image: lge-web:local
    environment: *app-env
    ports:
      - "3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-setup: { condition: service_completed_successfully }
      valkey: { condition: service_started }

  # Same image, not published; long tasks (publishing) run here, like the Kubernetes worker.
  worker:
    image: lge-web:local
    environment:
      <<: *app-env
      BACKGROUND_MODE: worker
    depends_on:
      web: { condition: service_started }

  # The worker's 15-second publish loop (the Kubernetes sidecar).
  worker-poller:
    image: curlimages/curl:8.11.1
    depends_on: [worker]
    entrypoint: >
      /bin/sh -c "
      while true; do
        curl -fsS -m 300 -H 'Authorization: Bearer local-compose-cron' http://worker:3000/api/cron/publish > /dev/null || echo 'publish run failed';
        sleep 15;
      done"

  # Demo data (optional): docker compose -f docker-compose.prod.yml --profile seed run --rm seed
  seed:
    profiles: [seed]
    build: { context: ., target: build }
    environment:
      DATABASE_URL: postgresql://lge:lge@postgres:5432/lge
    command: ["npx", "prisma", "db", "seed"]
    depends_on:
      migrate: { condition: service_completed_successfully }
