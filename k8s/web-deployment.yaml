# The app behind the Ingress: user traffic only. Long tasks run on the worker deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lge-web
  namespace: lge
  labels: { app.kubernetes.io/name: lge-web, app.kubernetes.io/part-of: ai-growth-engine }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: lge-web }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: lge-web, app.kubernetes.io/part-of: ai-growth-engine }
    spec:
      # Lets in-flight requests and short after-response work finish before the pod goes away.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: lge-web
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: lge-config }
            - secretRef: { name: lge-secrets }
          env:
            # Post now: the worker picks the job up (the web pod doesn't run it).
            - { name: BACKGROUND_MODE, value: "worker" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /api/health?ready=1, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # The load balancer stops sending traffic before the server starts shutting down.
            preStop:
              exec: { command: ["node", "-e", "setTimeout(() => {}, 10000)"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: next-cache, mountPath: /app/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: next-cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
