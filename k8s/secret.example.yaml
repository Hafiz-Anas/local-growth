# TEMPLATE — names only, never commit real values. DevOps creates the real Secret, e.g.:
#   kubectl -n lge create secret generic lge-secrets --from-env-file=lge-secrets.env
# (lge-secrets.env holds NAME=value lines and is never committed.) What each value is: DEPLOY-DIGITALOCEAN.md.
apiVersion: v1
kind: Secret
metadata:
  name: lge-secrets
  namespace: lge
type: Opaque
stringData:
  # Managed PostgreSQL: pooled connection (the app) and direct connection (migrations)
  DATABASE_URL: ""
  DIRECT_URL: ""
  # Auth.js session signing: openssl rand -base64 32
  AUTH_SECRET: ""
  # Instagram token encryption, 32 bytes base64: openssl rand -base64 32 (must never change once set)
  ENCRYPTION_KEY: ""
  # Cron and worker routes: openssl rand -base64 32
  CRON_SECRET: ""
  # Spaces access key pair (limited to the app's bucket)
  SPACES_KEY: ""
  SPACES_SECRET: ""
  # Managed Valkey/Redis, TLS: rediss://default:<password>@<host>:<port>
  REDIS_URL: ""
  # Gemini
  GEMINI_API_KEY: ""
  # Meta app
  META_APP_SECRET: ""
  META_WEBHOOK_VERIFY_TOKEN: ""
